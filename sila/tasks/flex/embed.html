<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Флекс</title>
    <link rel="stylesheet" href="pic.css">
    <link rel="stylesheet" href="../../tasks.css">
  </head>
  <body class="drawing-embed">
    <div class="canvas-wrapper">
            
            <input type="checkbox" id="clickToggle" class="click-toggle">
            <label class="canvas" for="clickToggle">
                
                <div class="text-hover">Где мяч?</div>
                <div class="text-click">Это кирпич!</div>

                <img src="images/boy1.png" class="character boy1" alt="Пацан стоит">
                <img src="images/boy2.png" class="character boy2" alt="Пацан думает">
                <img src="images/boy3.png" class="character boy3" alt="Пацан падает">

                <div class="item-wrapper ball-wrapper">
                    <img src="images/ball.png" class="item ball" alt="Мяч">
                </div>
                <div class="item-wrapper box-wrapper">
                    <img src="images/box.png" class="item box" alt="Кирпич">
                </div>

            </label>

            <div class="author-caption">
                Рисунок, вариант 2
            </div>
        </div>
  </body>
</html>
